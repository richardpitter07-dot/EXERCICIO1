</head>
<body>
    <script>
        let n1 = parseInt(prompt("digite o primeiro numero inteiro: "));
        let n2 = parseInt(prompt("digite o segundo numero inteiro: "));
        let n3 = parseInt(prompt("digite o terceiro numero inteiro: "));
        
        if (n1 === n2 && n2 === n3) {
    alert("Os três números são iguais.");
} else if (n1 >= n2 && n1 >= n3) {
    alert("O maior número é: " + n1);
} else if (n2 >= n1 && n2 >= n3) {
    alert("O maior número é: " + n2);
} else {
    alert("O maior número é: " + n3);
}
    </script>
